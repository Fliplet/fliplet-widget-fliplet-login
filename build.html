<div data-login-id="{{id}}">
  <div class="login-loader-holder animated">
    <div class="loader" data-translate="widgets.login.fliplet.loading">{{T "widgets.login.fliplet.loading"}}</div>
  </div>
  <div class="login-form-holder content-wrapper fliplet-login-button-wrapper">
    {{#if heading}}
    <h2>{{heading}}</h2>
    {{/if}}
    <div class="login-offline-notification" data-translate="widgets.login.fliplet.offline">
      {{T "widgets.login.fliplet.offline"}}
    </div>
    <button
      type="button"
      class="btn btn-primary fliplet-login-button"
      data-translate="widgets.login.fliplet.actions.signIn"
    >
      {{#if buttonLabel}}{{buttonLabel}}{{else}}{{T "widgets.login.fliplet.actions.signIn"}}{{/if}}
    </button>
    <div class="login-error-holder">
      <p data-translate="widgets.login.fliplet.errors.unableLogin">
        {{T "widgets.login.fliplet.errors.unableLogin"}}
      </p>
    </div>
  </div>
</div>
